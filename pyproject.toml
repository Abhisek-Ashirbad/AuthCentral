[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "authcentral"
version = "0.1.0"
description = "A modular username/password authentication plugin for FastAPI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100",
    "jinja2>=3.1",
    "PyJWT>=2.8",
    "python-multipart>=0.0.6",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
authcentral-setup = "authcentral.setup:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
authcentral = ["templates/*.html"]