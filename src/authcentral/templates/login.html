<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Sign in</title>
</head>
<body>
    <h1>Sign in</h1>
    {% if error %}<p role="alert">{{ error }}</p>{% endif %}
    <h2>Create account</h2>
    <form action="signup" method="post">
        <input type="text" name="username" placeholder="Username" minlength="1" maxlength="64" autocomplete="username" required>
        <input type="password" name="password" placeholder="Password (at least 8 characters)" minlength="8" maxlength="1024" autocomplete="new-password" required>
        <button type="submit">Register</button>
    </form>
    <h2>Log in</h2>
    <form action="signin" method="post">
        <input type="hidden" name="next" value="{{ request.query_params.get('next', '/') }}">
        <input type="text" name="username" placeholder="Username" maxlength="64" autocomplete="username" required>
        <input type="password" name="password" placeholder="Password" minlength="8" maxlength="1024" autocomplete="current-password" required>
        <button type="submit">Sign in</button>
    </form>
</body>
</html>
